<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <title></title>
    <link rel="stylesheet" href="xterm.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg, #101418);
        color: var(--muted, #9aa4ad);
        font: 12px system-ui;
      }
      #status {
        padding: 8px;
        height: 18px;
      }
      #keys {
        display: flex;
        gap: 6px;
        padding: 8px;
        height: 30px;
      }
      button {
        background: var(--key, #252b31);
        color: var(--key-ink, #e8ecef);
        border: 0;
        border-radius: 5px;
        padding: 6px 12px;
      }
      button:focus-visible {
        outline: 2px solid var(--ink, #e8ecef);
        outline-offset: 2px;
      }
      #term {
        height: calc(100% - 80px);
        padding: 0 8px;
      }
    </style>
  </head>
  <body>
    <div id="status">…</div>
    <div id="keys">
      <button data-key="esc">Esc</button>
      <button data-key="tab">Tab</button>
      <button data-key="up">↑</button>
      <button data-key="down">↓</button>
      <button data-key="ctrlc">Ctrl C</button>
      <button data-key="ctrls">Ctrl S</button>
      <button data-key="enter">Enter</button>
    </div>
    <div id="term"></div>
    <script src="xterm.js"></script>
    <script src="fit.js"></script>
    <script src="terminal.js"></script>
  </body>
</html>
